name: Deploy Angular Frontend

on:
  push:
    branches:
      - develop  # Cambia a 'main' si es tu rama de producción

jobs:
  deploy-frontend:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci # 'npm ci' es más rápido y limpio para CI/CD que 'npm install'

      - name: Build Project
        run: npm run build -- --configuration=production

      - name: Deploy to Nginx
        run: |
          # Identificar la ruta de salida (Angular suele generar dist/nombre-del-proyecto)
          # Usamos un wildcard /* para copiar el contenido, no la carpeta en sí
          sudo rm -rf /var/www/html/*
          
          # Ajusta 'dist/<nombre-de-tu-app>' según tu angular.json
          sudo cp -r dist/*/browser/* /var/www/html/ || sudo cp -r dist/*/* /var/www/html/

          # Permisos correctos
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html

      - name: Reload Nginx
        run: sudo systemctl reload nginx
