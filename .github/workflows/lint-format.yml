name: Lint y Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar Formato (Prettier)
        run: pnpm run format:check

      - name: Ejecutar Linter (ESLint)
        run: pnpm run lint

      - name: Construir Proyecto (Build)
        run: pnpm run build

      - name: Ejecutar Pruebas Unitarias (Vitest)
        run: pnpm test

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Production Target)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          tags: jasrapo-frontend:test
          load: true

      - name: Test Container Startup (Smoke Test)
        run: |
          docker run -d --name test-frontend -p 8080:80 jasrapo-frontend:test
          sleep 3
          curl -f http://localhost:8080/ || exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-frontend || true
