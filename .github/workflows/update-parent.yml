name: Actualizar Repo Unificado

on:
  push:
    branches:
      - main  # O 'master', revisa cómo se llama tu rama principal

jobs:
  update-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repo Padre (JASRAPO)
        uses: actions/checkout@v4
        with:
          repository: Brydyan/JASRAPO
          token: ${{ secrets.PERSONAL_TOKEN }}
          submodules: true
          fetch-depth: 0

      - name: Actualizar Referencia del Submódulo
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"
          
          # Actualizar el submódulo específico (ajusta el nombre de la carpeta si es diferente)
          git submodule update --remote frontend
          
          # Verificar si hay cambios para confirmar
          if [[ -n $(git status -s) ]]; then
            git add frontend
            git commit -m "Auto-update: Sincronizando cambios desde JAPO-FRONTEND"
            git push origin main
          else
            echo "No hay cambios detectados en el puntero del submódulo."
          fi
