server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types: re-incluir los tipos base y mapear .mjs a application/javascript
    # (nginx:alpine NO trae .mjs en su mime.types; sin esto, el navegador bloquea
    # los módulos ES por strict MIME checking y el PDF viewer nunca renderiza).
    types {
        include /etc/nginx/mime.types;
        application/javascript mjs;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Redirigir todas las rutas a index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para las llamadas al API del backend
    # Usamos variable para forzar resolución DNS en runtime
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend http://backend:3000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Needed for cookies
        proxy_set_header Access-Control-Allow-Credentials true;
    }
}
