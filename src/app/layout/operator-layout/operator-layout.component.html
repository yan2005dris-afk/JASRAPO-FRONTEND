<div class="mobile-layout">
  <!-- Top Navigation / Status Header -->
  <header class="operator-header">
    <div class="header-brand">
      <app-brand-logo
        size="xs"
        [showText]="true"
        [showSubtitle]="false"
        textColor="dark"
      ></app-brand-logo>
    </div>

    <div class="header-actions">
      <div class="header-status">
        <!-- Network Badge Indicator -->
        @if (networkService.isOnline()) {
          <span class="status-badge online" title="Conexión Online">
            <span class="status-dot animate-pulse"></span>
            Online
          </span>
        } @else {
          <span class="status-badge offline" title="Trabajando sin conexión">
            <span class="status-dot"></span>
            Offline
          </span>
        }

        <!-- Offline Sync Badge -->
        @if (syncService.totalPending() > 0) {
          <button
            class="sync-badge border-0"
            [class.syncing]="syncService.isSyncing()"
            [disabled]="!networkService.isOnline() || syncService.isSyncing()"
            (click)="forceSync()"
            [title]="
              networkService.isOnline()
                ? 'Sincronizar ahora'
                : 'Sincronización pendiente (sin conexión)'
            "
          >
            <i
              class="bi"
              [class.bi-arrow-repeat]="syncService.isSyncing()"
              [class.bi-cloud-arrow-up-fill]="!syncService.isSyncing()"
            ></i>
            <span class="pending-count">{{ syncService.totalPending() }}</span>
          </button>
        } @else {
          <span class="sync-badge synced" title="Todos los datos sincronizados">
            <i class="bi bi-cloud-check-fill"></i>
          </span>
        }
      </div>

      @if (pwaInstallService.canInstall()) {
        <button
          (click)="installApp()"
          class="install-btn"
          id="btn-install-app"
          title="Instalar la aplicación"
          aria-label="Instalar la aplicación"
        >
          <i class="bi bi-download"></i>
        </button>
      }

      <!-- User Profile link in Header -->
      <a
        routerLink="/app/operador/perfil"
        class="header-profile-btn"
        id="btn-header-profile"
        title="Mi Perfil"
        aria-label="Mi Perfil"
      >
        <i class="bi bi-person-circle"></i>
      </a>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="operator-viewport">
    <div class="content-scroll">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Bottom Floating Navigation Bar -->
  <nav class="operator-bottom-nav">
    <div class="nav-items-container">
      <!-- Tab 1: Inicio -->
      <a
        routerLink="/app/operador/inicio"
        routerLinkActive="active"
        class="nav-tab"
        id="tab-inicio"
        aria-label="Panel del Operador"
      >
        <div class="icon-wrapper">
          <i class="bi bi-house-door-fill"></i>
        </div>
        <span class="tab-label">Inicio</span>
      </a>

      <!-- Tab 2: Rutas -->
      <a
        routerLink="/app/operador/rutas"
        routerLinkActive="active"
        class="nav-tab"
        id="tab-rutas"
        aria-label="Mis Rutas"
      >
        <div class="icon-wrapper">
          <i class="bi bi-map-fill"></i>
        </div>
        <span class="tab-label">Rutas</span>
      </a>

      <!-- Tab 3: Órdenes de Trabajo -->
      <a
        routerLink="/app/operador/lecturas"
        routerLinkActive="active"
        class="nav-tab"
        id="tab-ordenes"
        aria-label="Órdenes de Trabajo"
      >
        <div class="icon-wrapper">
          <i class="bi bi-card-checklist"></i>
        </div>
        <span class="tab-label">Órdenes</span>
      </a>

      <!-- Tab 4: Novedades -->
      <a
        routerLink="/app/operador/novedades"
        routerLinkActive="active"
        class="nav-tab"
        id="tab-novedades"
        aria-label="Novedades de Campo"
      >
        <div class="icon-wrapper">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <span class="tab-label">Novedades</span>
      </a>

      <!-- Tab 5: Sincronización -->
      <a
        routerLink="/app/operador/sincronizar"
        routerLinkActive="active"
        class="nav-tab"
        id="tab-sincronizar"
        aria-label="Sincronización Offline"
      >
        <div class="icon-wrapper position-relative">
          <i class="bi bi-cloud-arrow-up"></i>
          @if (syncService.totalQueued() > 0) {
            <span class="nav-badge">{{ syncService.totalQueued() }}</span>
          }
        </div>
        <span class="tab-label">Sync</span>
      </a>
    </div>
  </nav>
</div>
