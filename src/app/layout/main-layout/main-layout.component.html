<div class="layout-wrapper">
  @if (layoutService.sidebarOpen()) {
    <button
      type="button"
      class="sidebar-overlay border-0"
      (click)="layoutService.closeSidebar()"
      aria-label="Cerrar menú lateral"
    ></button>
  }

  <!-- Sidebar unificado para todos los roles con navegación adaptativa -->
  <app-sidebar class="layout-sidebar" [class.sidebar-hidden]="!layoutService.sidebarOpen()">
  </app-sidebar>

  <div class="layout-main-container" [class.sidebar-collapsed]="!layoutService.sidebarOpen()">
    <app-header class="layout-header"></app-header>

    <main class="layout-content">
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Bottom Navigation para dispositivos móviles (solo en contexto operator) -->
  @if (appContextService.isOperator()) {
    <app-bottom-nav></app-bottom-nav>
  }
</div>
