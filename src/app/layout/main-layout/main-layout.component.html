<div class="layout-wrapper">
  @if (layoutService.sidebarOpen() && !authService.isOperator()) {
    <button
      type="button"
      class="sidebar-overlay border-0"
      (click)="layoutService.closeSidebar()"
      aria-label="Cerrar menú lateral"
    ></button>
  }

  <!-- El sidebar solo se muestra para roles que no son operador -->
  @if (!authService.isOperator()) {
    <app-sidebar class="layout-sidebar" [class.sidebar-hidden]="!layoutService.sidebarOpen()">
    </app-sidebar>
  }

  <div class="layout-main-container" [class.sidebar-collapsed]="!layoutService.sidebarOpen() || authService.isOperator()">
    <app-header class="layout-header"></app-header>

    <main class="layout-content">
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
