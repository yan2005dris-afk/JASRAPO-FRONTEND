<div class="layout-wrapper flex-grow-1" style="height: 100%; min-height: 0">
  @if (layoutService.sidebarOpen()) {
    <button
      type="button"
      class="sidebar-overlay border-0"
      (click)="layoutService.closeSidebar()"
      aria-label="Cerrar menú lateral"
    ></button>
  }

  <app-sidebar class="layout-sidebar" [class.sidebar-hidden]="!layoutService.sidebarOpen()">
  </app-sidebar>

  <div
    class="layout-main-container"
    [class.sidebar-collapsed]="!layoutService.sidebarOpen()"
    style="height: 100%"
  >
    <main class="layout-content" style="height: 100%">
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
