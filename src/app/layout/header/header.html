<header
  class="navbar navbar-expand-lg px-4"
  style="background: var(--topbar-bg); height: 64px; border-bottom: 1px solid var(--topbar-border)"
>
  <div class="container-fluid px-0">
    <!-- Hamburger Menu toggle (for sidebar) -->
    <button
      class="btn btn-link text-white px-0 text-decoration-none d-flex align-items-center"
      (click)="toggleSidebar()"
      aria-label="Alternar menú lateral"
    >
      <i class="bi bi-list fs-4"></i>
    </button>

    <!-- Right Side Icons -->
    <div class="d-flex align-items-center ms-auto gap-3">
      <button class="btn btn-link text-white btn-icon p-1" aria-label="Buscar">
        <i class="bi bi-search fs-5"></i>
      </button>
      <button
        class="btn btn-link text-white btn-icon p-1 position-relative"
        aria-label="Notificaciones"
      >
        <i class="bi bi-bell fs-5"></i>
        <!-- Optional notification dot -->
        <span
          class="position-absolute top-25 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"
        >
          <span class="visually-hidden">New alerts</span>
        </span>
      </button>
      <button class="btn btn-link text-white btn-icon p-1" aria-label="Cambiar tema">
        <i class="bi bi-moon fs-5"></i>
      </button>

      <!-- User Profile Dropdown -->
      @if (authService.currentUser(); as user) {
        <div class="dropdown position-relative">
          <button
            class="btn btn-link text-white text-decoration-none d-flex align-items-center gap-2 p-0"
            type="button"
            (click)="toggleUserDropdown()"
          >
            <div class="d-flex align-items-center gap-2">
              <div
                class="avatar bg-white text-primary fw-bold rounded-circle d-flex align-items-center justify-content-center overflow-hidden shadow-sm"
                style="width: 36px; height: 36px"
              >
                @if (user.avatar?.url) {
                  <img
                    [src]="user.avatar!.url"
                    [alt]="user.name"
                    class="w-100 h-100 object-fit-cover"
                  />
                } @else {
                  {{ user.name?.charAt(0)?.toUpperCase() }}
                }
              </div>
              <div class="d-none d-md-block text-start">
                <div class="fw-semibold text-white" style="font-size: 0.875rem">
                  {{ user.name }}
                </div>
                <div class="text-white-50" style="font-size: 0.75rem">
                  {{ user.roleName || 'Usuario' }}
                </div>
              </div>
              <i
                class="bi text-white-50"
                [class.bi-chevron-down]="!userDropdownOpen()"
                [class.bi-chevron-up]="userDropdownOpen()"
                style="font-size: 0.75rem"
              ></i>
            </div>
          </button>
          <ul
            class="dropdown-menu dropdown-menu-end shadow-sm"
            [class.show]="userDropdownOpen()"
            style="min-width: 200px"
          >
            <li>
              <a class="dropdown-item" routerLink="/app/profile" (click)="closeUserDropdown()">
                <i class="bi bi-person me-2"></i> Mi Perfil
              </a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/app/admin/config" (click)="closeUserDropdown()">
                <i class="bi bi-gear me-2"></i> Configuración
              </a>
            </li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li>
              <button class="dropdown-item text-danger" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
              </button>
            </li>
          </ul>
        </div>
      }
    </div>
  </div>
</header>
