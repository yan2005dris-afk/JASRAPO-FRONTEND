<section class="vh-100 d-flex m-0 p-0 overflow-hidden" @fadeAnimation>
    <!-- Left Side: Full Bleed Image / Illustration -->
    <!-- Muestra la imagen a la izquierda al 50% en escritorio y 60% en pantallas grandes -->
    <div class="image-side col-12 col-lg-6 col-xl-7 d-none d-lg-block p-0 m-0 position-relative h-100">
        <!-- Reemplazar con la foto del edificio de la Regional de Agua -->
        <img src="assets/JAPO.png" class="w-100 h-100" style="object-position: center;" alt="AquaManage Background">
    </div>

    <!-- Right Side: Form Container -->
    <div class="form-side col-12 col-lg-6 col-xl-5 d-flex flex-column justify-content-center px-4 px-md-5 bg-white h-100"
        @slideUpAnimation>

        <div class="w-100 mx-auto" style="max-width: 320px;">
            <!-- Opcional: Logo Corporativo para mantener la identidad del proyecto -->
            <div class="mb-5 d-flex justify-content-center w-100">
                <img src="assets/logo-jasrapo.png" class="img-fluid custom-logo-small mb-3" alt="Water Logo">
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" @staggerFormElements>
                <!-- Mensaje de error general -->
                <div *ngIf="errorMessage()" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                    {{ errorMessage() }}
                    <button type="button" class="btn-close" (click)="errorMessage.set(null)"
                        aria-label="Close"></button>
                </div>

                <!-- Usuario input -->
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold mb-1" for="email">Usuario</label>
                    <input type="email" id="email" class="form-control form-control-simple" formControlName="email"
                        placeholder="admin@japo.com" [ngClass]="{ 'is-invalid': submitted() && f['email'].errors }" />
                    <div *ngIf="submitted() && f['email'].errors" class="invalid-feedback">
                        <div *ngIf="f['email'].errors['required']">El usuario es requerido</div>
                        <div *ngIf="f['email'].errors['email']">Debe ser un correo válido</div>
                    </div>
                </div>

                <!-- Password input -->
                <div class="mb-4">
                    <label class="form-label text-muted small fw-semibold mb-1" for="password">contraseña</label>
                    <input type="password" id="password" class="form-control form-control-simple"
                        formControlName="password" placeholder="123456"
                        [ngClass]="{ 'is-invalid': submitted() && f['password'].errors }" />
                    <div *ngIf="submitted() && f['password'].errors" class="invalid-feedback">
                        <div *ngIf="f['password'].errors['required']">La contraseña es requerida</div>
                        <div *ngIf="f['password'].errors['minlength']">Mínimo 6 caracteres</div>
                    </div>
                </div>

                <!-- Contenedor de botones -->
                <div class="d-grid mb-3">
                    <!-- Submit button -->
                    <button type="submit" class="btn btn-brand-primary py-2 fw-semibold rounded-2 text-white shadow-sm"
                        [disabled]="loading()">
                        <span *ngIf="!loading()">Iniciar Sesión</span>
                        <span *ngIf="loading()">
                            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            Cargando...
                        </span>
                    </button>
                </div>

                <!-- Forgot Password -->
                <div class="text-start">
                    <a href="#!" class="text-secondary text-decoration-underline small hover-primary fw-medium"
                        style="font-size: 0.85rem;">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
            <!-- href de volver esquina superior derecha -->
            <div class="position-absolute top-0 end-0 m-3">
                <a href="#!" class="text-secondary text-decoration-underline small hover-primary fw-medium"
                    style="font-size: 0.85rem;">Volver al inicio</a>
            </div>
        </div>
    </div>
</section>
