<div class="modal fade show d-block picker-modal" tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" style="max-width: 640px">
    <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
      <!-- Header -->
      <div class="modal-header border-bottom px-4 py-3 bg-white">
        <div class="d-flex align-items-center gap-3">
          <div class="header-icon-tile">
            <i class="bi bi-map-fill"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bold text-dark mb-0 fs-5">
              {{ route() ? 'Editar Ruta de Lectura' : 'Nueva Ruta de Lectura' }}
            </h5>
            <p class="text-muted small mb-0">
              Planificación territorial y asignación de operarios en campo.
            </p>
          </div>
        </div>
        <button
          type="button"
          class="btn-close shadow-none"
          aria-label="Cerrar"
          (click)="close()"
          [disabled]="isLoading()"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-4 bg-white" style="max-height: 75vh; overflow-y: auto">
        <div class="row g-3">
          <!-- Nombre -->
          <div class="col-md-8">
            <label for="inputNombreRuta" class="form-label fw-semibold text-dark small mb-1">
              Nombre de la Ruta <span class="text-danger">*</span>
            </label>
            <input
              id="inputNombreRuta"
              type="text"
              class="form-control shadow-none"
              placeholder="Ej. Ruta Centro - Enero 2026"
              [ngModel]="nombre()"
              (ngModelChange)="nombre.set($event)"
              [disabled]="isLoading()"
            />
          </div>

          <!-- Tipo Ruta -->
          <div class="col-md-4">
            <label for="selectTipoRuta" class="form-label fw-semibold text-dark small mb-1">
              Tipo de Ruta <span class="text-danger">*</span>
            </label>
            <select
              id="selectTipoRuta"
              class="form-select shadow-none"
              [ngModel]="tipoRuta()"
              (ngModelChange)="tipoRuta.set($event)"
              [disabled]="isLoading()"
            >
              @for (opt of tipoOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          </div>

          <!-- Operario -->
          <div class="col-md-6">
            <label for="selectOperarioRuta" class="form-label fw-semibold text-dark small mb-1">
              Operario Asignado <span class="text-danger">*</span>
            </label>
            <select
              id="selectOperarioRuta"
              class="form-select shadow-none"
              [ngModel]="operarioId()"
              (ngModelChange)="operarioId.set($event)"
              [disabled]="isLoading()"
            >
              <option [ngValue]="null">Seleccione un operario...</option>
              @for (op of operarios(); track op.usuarioId) {
                <option [ngValue]="op.usuarioId">{{ op.nombres }} {{ op.apellidos }}</option>
              }
            </select>
          </div>

          <!-- Período -->
          <div class="col-md-6">
            <app-period-picker
              inputId="selectPeriodoRuta"
              label="Período"
              [selectedPeriodId]="periodoId()"
              [required]="true"
              [disabled]="isLoading()"
              (periodSelected)="onPeriodSelected($event)"
            />
          </div>

          <!-- Comunidad -->
          <div class="col-md-6">
            <label for="selectComunidadRuta" class="form-label fw-semibold text-dark small mb-1">
              Comunidad <span class="text-danger">*</span>
            </label>
            <select
              id="selectComunidadRuta"
              class="form-select shadow-none"
              [ngModel]="comunidadId()"
              (ngModelChange)="onComunidadChange($event)"
              [disabled]="isLoading()"
            >
              <option [ngValue]="null">Seleccione una comunidad...</option>
              @for (com of comunidades(); track com.id) {
                <option [ngValue]="com.id">{{ com.nombre }}</option>
              }
            </select>
          </div>

          <!-- Sector (opcional) -->
          <div class="col-md-6">
            <label for="selectSectorRuta" class="form-label fw-semibold text-dark small mb-1">
              Sector (Opcional)
            </label>
            <select
              id="selectSectorRuta"
              class="form-select shadow-none"
              [ngModel]="sectorId()"
              (ngModelChange)="sectorId.set($event)"
              [disabled]="isLoading()"
            >
              <option [ngValue]="null">Sin sector específico</option>
              @for (sec of filteredSectores(); track sec.sectorId) {
                <option [ngValue]="sec.sectorId">{{ sec.nombre }}</option>
              }
            </select>
          </div>

          <!-- Fecha Planificada -->
          <div class="col-12">
            <label
              for="inputFechaPlanificadaRuta"
              class="form-label fw-semibold text-dark small mb-1"
            >
              Fecha Planificada
            </label>
            <app-date-picker
              [inputId]="'inputFechaPlanificadaRuta'"
              [value]="fechaPlanificada()"
              [disabled]="isLoading()"
              (valueChange)="fechaPlanificada.set($event)"
            />
          </div>

          <!-- Descripción -->
          <div class="col-12">
            <label for="textareaDescRuta" class="form-label fw-semibold text-dark small mb-1">
              Notas / Descripción (Opcional)
            </label>
            <textarea
              id="textareaDescRuta"
              class="form-control shadow-none"
              rows="3"
              placeholder="Instrucciones especiales para el operario..."
              [ngModel]="descripcion()"
              (ngModelChange)="descripcion.set($event)"
              [disabled]="isLoading()"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-top px-4 py-3 bg-light d-flex justify-content-end gap-2">
        <button
          type="button"
          class="btn btn-secondary fw-medium px-3"
          (click)="close()"
          [disabled]="isLoading()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary fw-medium px-4 d-flex align-items-center gap-2"
          (click)="save()"
          [disabled]="!isFormValid() || isLoading()"
        >
          @if (isLoading()) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          }
          <i class="bi bi-check2"></i>
          {{ route() ? 'Guardar Cambios' : 'Crear Ruta' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
