<div class="modal fade show d-block picker-modal" tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 480px">
    <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
      <!-- Header -->
      <div class="modal-header border-bottom px-4 py-3 bg-white">
        <div class="d-flex align-items-center gap-3">
          <div class="header-icon-tile">
            <i class="bi bi-arrow-left-right"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bold text-dark mb-0 fs-5">Reasignar Operario</h5>
            <p class="text-muted small mb-0">{{ route().nombre }}</p>
          </div>
        </div>
        <button
          type="button"
          class="btn-close shadow-none"
          aria-label="Cerrar"
          (click)="close()"
          [disabled]="isLoading()"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-4 bg-white">
        <div class="p-3 bg-light rounded-3 mb-3 border">
          <div class="d-flex justify-content-between small mb-1">
            <span class="text-muted">Ruta:</span>
            <span class="fw-bold text-dark">{{ route().nombre }}</span>
          </div>
          <div class="d-flex justify-content-between small">
            <span class="text-muted">Operario Actual:</span>
            <span class="badge badge-soft-info">{{ getOperarioNombre(route().operarioId) }}</span>
          </div>
        </div>

        <div class="mb-2">
          <label for="selectNuevoOperario" class="form-label fw-semibold text-dark small mb-1">
            Nuevo Operario Asignado <span class="text-danger">*</span>
          </label>
          <select
            id="selectNuevoOperario"
            class="form-select shadow-none"
            [(ngModel)]="nuevoOperarioId"
            [disabled]="isLoading()"
          >
            <option [ngValue]="null" disabled>Seleccione un nuevo operario...</option>
            @for (op of operarios(); track op.usuarioId) {
              <option [ngValue]="op.usuarioId" [disabled]="op.usuarioId === route().operarioId">
                {{ op.nombres }} {{ op.apellidos }}
                @if (op.usuarioId === route().operarioId) {
                  (Actual)
                }
              </option>
            }
          </select>
          @if (nuevoOperarioId() === route().operarioId) {
            <div class="text-warning small mt-1" style="font-size: 0.75rem">
              El operario seleccionado es el mismo actualmente asignado.
            </div>
          }
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-top px-4 py-3 bg-light d-flex justify-content-between">
        <button
          type="button"
          class="btn btn-outline-secondary fw-medium px-3"
          (click)="close()"
          [disabled]="isLoading()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary d-flex align-items-center gap-2 fw-medium px-4"
          (click)="submit()"
          [disabled]="!isValid || isLoading"
        >
          @if (isLoading()) {
            <span class="spinner-border spinner-border-sm" role="status"></span>
          }
          @if (!isLoading()) {
            <i class="bi bi-check-circle"></i>
          }
          {{ isLoading() ? 'Reasignando...' : 'Confirmar Reasignación' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
