<div class="modal fade show d-block picker-modal" tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 540px">
    <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
      <!-- Header -->
      <div class="modal-header border-bottom px-4 py-3 bg-white">
        <div class="d-flex align-items-center gap-3">
          <div class="header-icon-tile">
            <i class="bi bi-exclamation-triangle-fill text-warning"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bold text-dark mb-0 fs-5">
              {{ anomaly() ? 'Editar Anomalía' : 'Reportar Anomalía de Lectura' }}
            </h5>
            <p class="text-muted small mb-0">Notificación de incidentes, fugas o inconsistencias en medidores.</p>
          </div>
        </div>
        <button
          type="button"
          class="btn-close shadow-none"
          aria-label="Cerrar"
          (click)="close()"
          [disabled]="isLoading"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-4 bg-white" style="max-height: 75vh; overflow-y: auto">
        <div class="row g-3">
          <!-- Lectura ID -->
          <div class="col-md-6">
            <label for="inputLecturaIdAnomalia" class="form-label fw-semibold text-dark small mb-1">
              ID de Lectura <span class="text-danger">*</span>
            </label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted">
                <i class="bi bi-speedometer2"></i>
              </span>
              <input
                id="inputLecturaIdAnomalia"
                type="text"
                class="form-control shadow-none"
                placeholder="Ej. 1"
                [(ngModel)]="lecturaId"
                [disabled]="isLoading || !!anomaly()"
              />
            </div>
          </div>

          <!-- Tipo Anomalía -->
          <div class="col-md-6">
            <label for="selectTipoAnomalia" class="form-label fw-semibold text-dark small mb-1">
              Tipo de Incidente <span class="text-danger">*</span>
            </label>
            <select id="selectTipoAnomalia" class="form-select shadow-none" [(ngModel)]="tipo" [disabled]="isLoading">
              @for (opt of tipoOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          </div>

          <!-- Observación -->
          <div class="col-12">
            <label for="textareaObservacionAnomalia" class="form-label fw-semibold text-dark small mb-1">
              Descripción de la Anomalía
            </label>
            <textarea
              id="textareaObservacionAnomalia"
              class="form-control form-control-sm shadow-none"
              rows="3"
              placeholder="Detallá lo observado en el punto de medición..."
              [(ngModel)]="observacion"
              [disabled]="isLoading"
            ></textarea>
          </div>

          <!-- Captura de Foto Evidencia -->
          <div class="col-12">
            <span class="form-label d-block fw-semibold text-dark small mb-1">Foto de Evidencia</span>
            <div class="p-3 border rounded-3 bg-light text-center">
              @if (imagePreviewUrl) {
                <div class="position-relative d-inline-block">
                  <img
                    [src]="imagePreviewUrl"
                    alt="Evidencia anomalía"
                    class="rounded-3 shadow-sm"
                    style="max-height: 180px; max-width: 100%; object-fit: contain"
                  />
                  <button
                    type="button"
                    class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 rounded-circle p-1"
                    style="width: 26px; height: 26px; line-height: 1"
                    (click)="removePhoto()"
                    title="Eliminar foto"
                  >
                    <i class="bi bi-x"></i>
                  </button>
                </div>
              } @else {
                <div class="py-2">
                  <i class="bi bi-camera fs-2 text-muted mb-2 d-block"></i>
                  <p class="text-muted small mb-2">Adjuntá una fotografía del daño, fuga o irregularidad</p>
                  <label for="inputFileFotoAnomalia" class="btn btn-sm btn-outline-primary fw-medium px-3 cursor-pointer">
                    <i class="bi bi-upload me-1"></i> Adjuntar Foto
                    <input
                      id="inputFileFotoAnomalia"
                      type="file"
                      accept="image/*"
                      class="d-none"
                      (change)="onFileSelected($event)"
                      [disabled]="isLoading"
                    />
                  </label>
                </div>
              }
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-top px-4 py-3 bg-light d-flex justify-content-between">
        <button
          type="button"
          class="btn btn-outline-secondary fw-medium px-3"
          (click)="close()"
          [disabled]="isLoading"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary d-flex align-items-center gap-2 fw-medium px-4"
          (click)="submit()"
          [disabled]="!isFormValid || isLoading"
        >
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm" role="status"></span>
          }
          @if (!isLoading) {
            <i class="bi bi-check-circle"></i>
          }
          {{ isLoading ? 'Guardando...' : anomaly() ? 'Actualizar' : 'Reportar Anomalía' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
