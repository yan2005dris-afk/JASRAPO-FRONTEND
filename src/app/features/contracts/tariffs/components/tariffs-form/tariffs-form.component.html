<form [formGroup]="tariffForm" (ngSubmit)="onSubmit()">
  <div class="modal-header">
    <h5 class="modal-title fw-bold">{{ tariffToEdit() ? 'Editar Tarifa' : 'Nueva Tarifa' }}</h5>
    <button
      type="button"
      class="btn-close shadow-none"
      aria-label="Cerrar"
      (click)="onClose()"
    ></button>
  </div>

  <div class="modal-body">
    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <div class="row g-3">
      <div class="col-12">
        <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
        <input id="nombre" type="text" class="form-control" formControlName="nombre" />
        @if (isFieldInvalid('nombre')) {
          <small class="text-danger">El nombre es obligatorio.</small>
        }
      </div>

      <div class="col-12">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea id="descripcion" class="form-control" formControlName="descripcion" rows="3" placeholder="Descripción opcional de la categoría"></textarea>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="onClose()" [disabled]="isSaving">
      Cancelar
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving">
      {{ isSaving ? 'Guardando...' : 'Guardar cambios' }}
    </button>
  </div>
</form>
