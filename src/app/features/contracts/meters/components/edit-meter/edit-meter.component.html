<form [formGroup]="form" (ngSubmit)="submit()">
  <!-- Cabecera del modal -->
  <div class="modal-header">
    <h5 class="modal-title fw-bold">
      Editar estado del medidor <span class="text-primary">[{{ medidor()?.serie || 'S/N' }}]</span>
    </h5>
    <button
      type="button"
      class="btn-close"
      aria-label="Cerrar"
      [disabled]="isSaving()"
      (click)="close()"
    ></button>
  </div>

  <!-- Formulario -->
  <div class="modal-body">
    @if (errorMessage()) {
      <div class="alert alert-danger py-2 px-3 mb-3 small d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Selección de Estado -->
    <div class="mb-3">
      <label for="estadoEditar" class="form-label fw-medium"
        >Estado <span class="text-dark fw-bold ms-1">*</span></label
      >
      <select
        id="estadoEditar"
        class="form-select"
        formControlName="estadoId"
        [class.is-invalid]="form.controls.estadoId.invalid && form.controls.estadoId.touched"
      >
        <option [ngValue]="null" disabled>ESTADO</option>
        <!-- Iteración sobre los objetos IEstadoMedidor que vienen de la BD -->
        @for (estado of estados(); track estado.estadoId) {
          <option [value]="estado.estadoId">
            {{ estado.nombre | uppercase }}
          </option>
        }
      </select>
      @if (form.controls.estadoId.invalid && form.controls.estadoId.touched) {
        <div class="invalid-feedback">Debe seleccionar un estado.</div>
      }
    </div>

    <!-- Área de Observaciones -->
    <div class="mb-3">
      <label for="observacion" class="form-label fw-medium">Observación</label>
      <textarea
        id="observacion"
        class="form-control"
        rows="5"
        formControlName="observacion"
        placeholder="Ingrese el motivo o una observación técnica..."
        style="resize: none"
      ></textarea>
    </div>
  </div>

  <!-- Acciones del formulario -->
  <div class="modal-footer pt-0 border-top-0">
    <button
      type="button"
      class="btn btn-outline-secondary btn-sm fw-medium px-3"
      (click)="close()"
      [disabled]="isSaving()"
    >
      Cancelar
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving() || form.invalid">
      {{ isSaving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</form>
