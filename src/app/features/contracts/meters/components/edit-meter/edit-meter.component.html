<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="modal-header">
    <div>
      <h5 class="modal-title fw-bold">
        Editar Estado del Medidor <span class="text-primary">[{{ medidor()?.serie || 'S/N' }}]</span>
      </h5>
      <p class="text-muted mb-0 small">
        Actualice el estado del medidor y registre las observaciones correspondientes.
      </p>
    </div>

    <button
      type="button"
      class="btn-close shadow-none"
      aria-label="Cerrar"
      [disabled]="isSaving()"
      (click)="close()"
    ></button>
  </div>

  <div class="modal-body">
    @if (errorMessage()) {
      <div class="alert alert-danger py-2 px-3 mb-3 small d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Selección de Estado -->
    <div class="mb-3">
      <label for="estadoEditar" class="form-label fw-medium"
        >Estado <span class="text-dark fw-bold ms-1">*</span></label
      >
      <select
        id="estadoEditar"
        class="form-select"
        formControlName="codigo"
        [class.is-invalid]="form.controls.codigo.invalid && form.controls.codigo.touched"
      >
        <option value="" disabled>ESTADO</option>
        <!-- Iteración sobre los objetos IEstadoMedidor que vienen de la BD -->
        @for (estado of estados(); track estado.codigo) {
          <option [value]="estado.codigo">
            {{ estado.nombre | uppercase }}
          </option>
        }
      </select>
      @if (form.controls.codigo.invalid && form.controls.codigo.touched) {
        <div class="invalid-feedback">Debe seleccionar un estado.</div>
      }
    </div>

      <!-- Área de Observaciones -->
      <div class="col-12">
        <label for="observacion" class="form-label fw-semibold">Observación</label>
        <textarea
          id="observacion"
          class="form-control"
          rows="4"
          formControlName="observacion"
          placeholder="Ingrese el motivo o una observación técnica..."
          style="resize: none"
        ></textarea>
      </div>
   
  </div>

  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary fw-medium px-4"
      [disabled]="isSaving()"
      (click)="close()"
    >
      Cancelar
    </button>
    <button type="submit" class="btn btn-primary px-4" [disabled]="isSaving() || form.invalid">
      {{ isSaving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</form>
