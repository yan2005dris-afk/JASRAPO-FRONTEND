<div class="dashboard-container">
  <!-- Welcome Banner -->
  @if (currentUser(); as user) {
    <div class="alert alert-light border mb-4" role="alert">
      <div class="d-flex align-items-center">
        <div
          class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3 dashboard-avatar"
          aria-hidden="true"
        >
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
        <div>
          <h5 class="mb-1">¡Bienvenido, {{ user.name }}!</h5>
          <p class="mb-0 text-muted">
            Rol: <strong>{{ user.role }}</strong> | Email: {{ user.email }}
          </p>
        </div>
      </div>
    </div>
  }

  <!-- Metrics Grid -->
  <section class="mb-4" aria-label="Métricas del dashboard">
    <app-metrics-grid [metrics]="metrics()" />
  </section>

  <!-- Stats Summary -->
  <section class="mb-4" aria-label="Resumen de estadísticas">
    <app-stats-summary [stats]="stats()" />
  </section>

  <!-- Recent Clients -->
  <section aria-label="Gestión de clientes">
    <h3 class="fw-bold mb-3 text-dark fs-5">Gestión de Clientes</h3>
    <app-recent-clients
      [clients]="filteredClients()"
      [filters]="filters"
      [activeFilter]="activeFilter()"
      (filterChanged)="onFilterChanged($event)"
      (searchChanged)="onSearchChanged($event)"
    />
  </section>
</div>
