<div class="dashboard-container">
    <h3 class="fw-bold mb-4 text-dark fs-4">Gestión de Clientes</h3>

    <div class="card border-0 shadow-sm rounded-3">
        <!-- Card Header (Search & Actions) -->
        <div
            class="card-header bg-white border-bottom-0 pt-4 pb-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h5 class="fw-bold mb-0 fs-6">Lista de Clientes</h5>

            <div class="d-flex align-items-center gap-2 flex-wrap">
                <!-- Search -->
                <div class="input-group search-group">
                    <span class="input-group-text bg-white border-end-0 text-muted ps-3 pe-2">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-0 shadow-none"
                        placeholder="Buscar cliente...">
                </div>

                <!-- Primary Action -->
                <button class="btn btn-primary d-flex align-items-center gap-2 fw-medium px-3">
                    <i class="bi bi-plus-lg"></i> Agregar Cliente
                </button>

                <!-- Bulk Actions Dropdown -->
                <button class="btn btn-outline-secondary d-flex align-items-center gap-2 fw-medium bg-white text-muted">
                    Acciones Masivas <i class="bi bi-chevron-down ms-1" style="font-size: 0.75rem;"></i>
                </button>
            </div>
        </div>

        <!-- Sub-Header (Filters) -->
        <div class="px-4 pb-3 d-flex align-items-center border-bottom flex-wrap gap-2">
            <span class="text-muted small me-2 d-flex align-items-center gap-1">
                <i class="bi bi-funnel"></i> Filtros rápidos:
            </span>

            <!-- Pill Filters -->
            <button class="btn btn-filter rounded-pill px-3 py-1" [class.active]="activeFilter === 'Todos'"
                (click)="setFilter('Todos')">Todos</button>
            <button class="btn btn-filter rounded-pill px-3 py-1" [class.active]="activeFilter === 'Morosos'"
                (click)="setFilter('Morosos')">Morosos</button>
            <button class="btn btn-filter rounded-pill px-3 py-1" [class.active]="activeFilter === 'Sin Lectura'"
                (click)="setFilter('Sin Lectura')">Sin Lectura</button>

            <!-- Regular Dropdown -->
            <button
                class="btn btn-outline-secondary btn-sm ms-2 d-flex align-items-center gap-2 bg-white text-muted px-3 py-1 rounded-3">
                Option 1 <i class="bi bi-chevron-down ms-1" style="font-size: 0.7rem;"></i>
            </button>
        </div>

        <!-- Data Table -->
        <div class="table-responsive px-4 pt-3">
            <table class="table table-hover align-middle mb-0 custom-table">
                <thead>
                    <tr>
                        <th scope="col" style="width: 40px;">
                            <input class="form-check-input table-checkbox" type="checkbox">
                        </th>
                        <th scope="col" class="text-muted fw-semibold small">Nombre</th>
                        <th scope="col" class="text-muted fw-semibold small">Sector</th>
                        <th scope="col" class="text-muted fw-semibold small">Último Consumo (m³)</th>
                        <th scope="col" class="text-muted fw-semibold small">Estado</th>
                        <th scope="col" class="text-muted fw-semibold small text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let client of clients">
                        <td>
                            <input class="form-check-input table-checkbox" type="checkbox">
                        </td>
                        <td class="fw-medium text-dark" style="font-size: 0.95rem;">{{ client.nombre }}</td>
                        <td class="text-muted small">{{ client.sector }}</td>
                        <td class="text-dark small">{{ client.consumo }}</td>
                        <td>
                            <span class="badge rounded-pill fw-medium" [ngClass]="{
                                      'badge-soft-success': client.estado === 'Activo',
                                      'badge-soft-warning': client.estado === 'Sin lectura',
                                      'badge-soft-danger': client.estado === 'Moroso'
                                  }">
                                {{ client.estado }}
                            </span>
                        </td>
                        <td class="text-center">
                            <button class="btn btn-link text-muted p-0 shadow-none"><i
                                    class="bi bi-three-dots-vertical"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer / Pagination -->
        <div
            class="card-footer bg-white border-top px-4 py-3 d-flex justify-content-between align-items-center flex-wrap">
            <span class="text-muted small" style="line-height: 1.2;">Total: 6<br>clientes</span>

            <nav>
                <ul class="pagination pagination-sm mb-0 align-items-center gap-1">
                    <li class="page-item disabled">
                        <a class="page-link border-0 text-dark bg-transparent fw-medium small" href="#" tabindex="-1"
                            aria-disabled="true">
                            <i class="bi bi-chevron-left me-1" style="font-size: 0.7rem;"></i> Previous
                        </a>
                    </li>
                    <li class="page-item active" aria-current="page">
                        <a class="page-link shadow-sm border text-dark fw-semibold"
                            style="border-radius: 6px; background-color: white;" href="#">1</a>
                    </li>
                    <li class="page-item"><a class="page-link border-0 text-dark bg-transparent fw-medium"
                            href="#">2</a></li>
                    <li class="page-item">
                        <a class="page-link border-0 text-dark bg-transparent fw-medium small" href="#">
                            Next <i class="bi bi-chevron-right ms-1" style="font-size: 0.7rem;"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
