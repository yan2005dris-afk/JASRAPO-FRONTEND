<div class="stats-summary">
  <div class="stats-summary__item">
    <span class="stats-summary__label">Consumo Total</span>
    <span class="stats-summary__value">{{ stats().totalConsumption }} m³</span>
  </div>
  <div class="stats-summary__item">
    <span class="stats-summary__label">Promedio por Cliente</span>
    <span class="stats-summary__value">{{ stats().averageConsumption }} m³</span>
  </div>
  <div class="stats-summary__item">
    <span class="stats-summary__label">Lecturas Pendientes</span>
    <span class="stats-summary__value">{{ stats().pendingReadings }}</span>
  </div>
</div>
