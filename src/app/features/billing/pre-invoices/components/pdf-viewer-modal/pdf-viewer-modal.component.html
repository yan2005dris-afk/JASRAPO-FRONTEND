<div class="modal fade show d-block picker-modal" tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered modal-xl" style="max-width: 900px">
    <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
      <!-- Header -->
      <div class="modal-header border-bottom px-4 py-3 bg-white">
        <div class="d-flex align-items-center gap-3">
          <div class="header-icon-tile">
            <i class="bi bi-file-earmark-pdf"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bold text-dark mb-0 fs-5">
              Vista Previa — Prefactura #{{ preInvoice().prefacturaId }}
            </h5>
            <p class="text-muted small mb-0">
              {{ preInvoice().clienteNombre || 'Contrato #' + preInvoice().contratoId }}
            </p>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1"
            (click)="download()"
            [disabled]="!pdfBlob()"
          >
            <i class="bi bi-download"></i> Descargar
          </button>
          <button
            type="button"
            class="btn-close shadow-none ms-2"
            aria-label="Cerrar"
            (click)="close()"
          ></button>
        </div>
      </div>

      <!-- Body -->
      <div class="modal-body p-3 bg-light">
        @if (pdfBlob()) {
          <app-pdf-previewer [src]="pdfBlob()!" height="620px" />
        } @else {
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 text-muted small mb-0">Cargando documento PDF...</p>
          </div>
        }
      </div>

      <!-- Footer -->
      <div class="modal-footer border-top px-4 py-2 bg-white d-flex justify-content-end">
        <button type="button" class="btn btn-secondary fw-medium px-4" (click)="close()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
