<div class="rubros-container">
  <!-- Page Header -->
  <div class="page-header d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div class="d-flex align-items-center gap-3">
      <div class="page-header-icon">
        <i class="bi bi-box-seam"></i>
      </div>
      <div>
        <h3 class="fw-bold mb-0 text-dark fs-4">Catálogo de Rubros y Tarifas</h3>
        <p class="text-muted small mb-0">
          Administrá los conceptos facturables, precios unitarios y tarifas de impuestos asociadas.
        </p>
      </div>
    </div>

    <!-- Primary Action -->
    <button
      type="button"
      class="btn btn-primary d-flex align-items-center gap-2 fw-medium px-4 py-2"
      (click)="openCreateModal()"
    >
      <i class="bi bi-plus-circle"></i>
      Nuevo Rubro
    </button>
  </div>

  <!-- Card with Filters & Table -->
  <div class="card border-0 shadow-sm rounded-3 mb-4">
    <!-- Toolbar -->
    <div class="card-header bg-white border-bottom-0 pt-4 pb-3 px-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2 flex-wrap flex-grow-1">
          <!-- Search by Name -->
          <div class="input-group search-group" style="max-width: 240px">
            <span class="input-group-text bg-white border-end-0 text-muted ps-3 pe-2">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control border-start-0 ps-0 shadow-none"
              placeholder="Buscar por nombre..."
              [(ngModel)]="filterNombre"
              (keyup.enter)="loadRubros()"
            />
          </div>

          <!-- Filter Tipo -->
          <select
            class="form-select shadow-none"
            style="width: 190px"
            [(ngModel)]="filterTipo"
            (change)="loadRubros()"
          >
            <option value="">Todos los tipos</option>
            @for (opt of tipoOptions; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>

          <!-- Filter Tarifa Impuesto -->
          <select
            class="form-select shadow-none"
            style="width: 180px"
            [(ngModel)]="filterTarifa"
            (change)="loadRubros()"
          >
            <option value="">Todas las tarifas IVA</option>
            @for (t of tarifasImpuesto; track t.id) {
              <option [value]="t.id">{{ t.descripcion }} ({{ t.porcentaje }}%)</option>
            }
          </select>

          <!-- Filter Activo -->
          <select
            class="form-select shadow-none"
            style="width: 140px"
            [(ngModel)]="filterActivo"
            (change)="loadRubros()"
          >
            <option value="todos">Todos (Estado)</option>
            <option value="activos">Activos</option>
            <option value="inactivos">Inactivos</option>
          </select>

          <!-- Filter Tipo Generacion / Origen -->
          <select
            class="form-select shadow-none"
            style="width: 160px"
            [(ngModel)]="filterGeneracion"
            (change)="loadRubros()"
          >
            <option value="todos">Todos (Origen)</option>
            <option value="automatico">Automático</option>
            <option value="manual">Manual</option>
          </select>

          <!-- Buscar -->
          <button
            class="btn btn-primary d-flex align-items-center gap-2 fw-medium px-3"
            (click)="loadRubros()"
            [disabled]="isLoading"
          >
            @if (isLoading) {
              <span
                class="spinner-border spinner-border-sm"
                role="status"
                aria-hidden="true"
              ></span>
            }
            @if (!isLoading) {
              <i class="bi bi-search"></i>
            }
            Buscar
          </button>

          <!-- Limpiar -->
          <button
            class="btn btn-outline-secondary d-flex align-items-center gap-2 fw-medium px-3"
            (click)="limpiarFiltros()"
            [disabled]="isLoading"
          >
            <i class="bi bi-x-circle"></i>
            Limpiar
          </button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="pt-2">
      <app-rubro-table
        [rubros]="rubros"
        [isLoading]="isLoading"
        [selectionMode]="false"
        (editRubro)="openEditModal($event)"
        (toggleStatus)="toggleRubroStatus($event)"
        (deleteRubro)="deleteRubro($event)"
        (createClicked)="openCreateModal()"
      />

        <!-- Pagination -->
        <div class="px-4 py-3 border-top bg-white">
          <app-pagination
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            [totalItems]="totalItems"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)"
          />
        </div>
    </div>
  </div>

  <!-- CREATE / EDIT MODAL -->
  @if (isFormModalOpen) {
    <app-rubro-form-modal
      [rubro]="selectedRubroForEdit"
      (saved)="onRubroSaved()"
      (closed)="closeFormModal()"
    />
  }
</div>
