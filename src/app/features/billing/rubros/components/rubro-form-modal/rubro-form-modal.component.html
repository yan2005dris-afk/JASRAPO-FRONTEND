<div class="modal-backdrop fade show" (click)="close()"></div>
<div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <!-- Header -->
      <div class="modal-header border-bottom px-4 py-3 bg-light rounded-top-4">
        <div class="d-flex align-items-center gap-3">
          <div class="modal-header-icon rounded-circle d-flex align-items-center justify-content-center bg-primary-subtle text-primary" style="width: 40px; height: 40px;">
            <i class="bi bi-box-seam fs-5"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bold text-dark mb-0">
              {{ rubro() ? 'Editar Rubro' : 'Nuevo Rubro' }}
            </h5>
            <p class="text-muted small mb-0">
              {{ rubro() ? 'Modificá las especificaciones y valores del rubro' : 'Registrá un nuevo concepto facturable en el sistema' }}
            </p>
          </div>
        </div>
        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="close()"
          [disabled]="isLoading"
        ></button>
      </div>

      <!-- Body Form -->
      <div class="modal-body px-4 py-4">
        <form (ngSubmit)="submit()">
          <div class="row g-3">
            <!-- Nombre del Rubro -->
            <div class="col-md-8">
              <label class="form-label fw-semibold small text-dark">
                Nombre del Rubro <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                placeholder="Ej. Consumo Agua Potable"
                [(ngModel)]="nombre"
                name="nombre"
                required
                [disabled]="isLoading"
              />
            </div>

            <!-- Código SRI -->
            <div class="col-md-4">
              <label class="form-label fw-semibold small text-dark">
                Código SRI / Identificador
              </label>
              <input
                type="text"
                class="form-control"
                placeholder="Ej. 001"
                [(ngModel)]="codigoSri"
                name="codigoSri"
                [disabled]="isLoading"
              />
            </div>

            <!-- Descripción -->
            <div class="col-12">
              <label class="form-label fw-semibold small text-dark">
                Descripción <span class="text-danger">*</span>
              </label>
              <textarea
                class="form-control"
                rows="2"
                placeholder="Descripción detallada para la factura o comprobante..."
                [(ngModel)]="descripcion"
                name="descripcion"
                required
                [disabled]="isLoading"
              ></textarea>
            </div>

            <!-- Tipo de Rubro -->
            <div class="col-md-6">
              <label class="form-label fw-semibold small text-dark">
                Tipo de Rubro <span class="text-danger">*</span>
              </label>
              <select
                class="form-select"
                [(ngModel)]="tipoRubro"
                name="tipoRubro"
                required
                [disabled]="isLoading"
              >
                @for (opt of tipoRubroOptions; track opt.value) {
                  <option [value]="opt.value">{{ opt.label }}</option>
                }
              </select>
            </div>

            <!-- Tarifa Impuesto IVA -->
            <div class="col-md-6">
              <label class="form-label fw-semibold small text-dark">
                Tarifa Impuesto IVA <span class="text-danger">*</span>
              </label>
              <select
                class="form-select"
                [(ngModel)]="tarifaImpuestoId"
                name="tarifaImpuestoId"
                required
                [disabled]="isLoading"
              >
                <option [ngValue]="null" disabled>Seleccionar tarifa de impuesto...</option>
                @for (t of tarifasImpuesto; track t.id) {
                  <option [ngValue]="t.id">
                    {{ t.descripcion }} ({{ t.porcentaje }}%)
                  </option>
                }
              </select>
            </div>

            <!-- Precio Unitario -->
            <div class="col-md-6">
              <label class="form-label fw-semibold small text-dark">
                Precio Unitario (USD) <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light fw-medium">$</span>
                <input
                  type="number"
                  class="form-control"
                  step="0.01"
                  min="0"
                  placeholder="0.00"
                  [(ngModel)]="precioUnitario"
                  name="precioUnitario"
                  required
                  [disabled]="isLoading"
                />
              </div>
              <div class="form-text small">
                Precio base sin impuestos. Para rubros variables, es el valor por metro cúbico.
              </div>
            </div>

            <!-- Estado Activo Toggle -->
            <div class="col-md-6 d-flex align-items-center">
              <div class="form-check form-switch pt-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="rubroActivoSwitch"
                  [(ngModel)]="activo"
                  name="activo"
                  [disabled]="isLoading"
                />
                <label class="form-check-label fw-semibold small text-dark ms-2" for="rubroActivoSwitch">
                  Rubro Activo (Disponible para facturación)
                </label>
              </div>
            </div>

            <!-- Autogenerado Toggle -->
            <div class="col-md-6 d-flex align-items-center">
              <div class="form-check form-switch pt-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="rubroAutoSwitch"
                  [(ngModel)]="esAutomatico"
                  name="esAutomatico"
                  [disabled]="isLoading"
                />
                <label class="form-check-label fw-semibold small text-dark ms-2" for="rubroAutoSwitch">
                  Autogenerado / Calculado por el sistema
                </label>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Footer Actions -->
      <div class="modal-footer border-top px-4 py-3 bg-light rounded-bottom-4">
        <button
          type="button"
          class="btn btn-outline-secondary px-4 fw-medium"
          (click)="close()"
          [disabled]="isLoading"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary px-4 fw-medium d-flex align-items-center gap-2"
          (click)="submit()"
          [disabled]="!isFormValid || isLoading"
        >
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          }
          {{ rubro() ? 'Guardar Cambios' : 'Crear Rubro' }}
        </button>
      </div>
    </div>
  </div>
</div>
