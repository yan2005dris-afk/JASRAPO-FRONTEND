<div class="modal fade show d-block picker-modal" tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 460px">
    <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
      <!-- Header -->
      <div class="modal-header border-bottom px-4 py-3 bg-white">
        <div class="d-flex align-items-center gap-3">
          <div class="header-icon-tile danger-tile">
            <i class="bi bi-exclamation-triangle-fill"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bold text-danger mb-0 fs-5">Anular Pago</h5>
            <p class="text-muted small mb-0">Esta acción revertirá las aplicaciones del pago.</p>
          </div>
        </div>
        <button
          type="button"
          class="btn-close shadow-none"
          aria-label="Cerrar"
          (click)="close()"
          [disabled]="isLoading"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-4 bg-white">
        <div class="p-3 bg-light rounded-3 mb-3 border">
          <div class="d-flex justify-content-between small mb-1">
            <span class="text-muted">ID de Pago:</span>
            <span class="fw-bold text-dark">#{{ payment().pagoId }}</span>
          </div>
          <div class="d-flex justify-content-between small mb-1">
            <span class="text-muted">Fecha:</span>
            <span class="text-dark">{{ payment().fechaPago }}</span>
          </div>
          <div class="d-flex justify-content-between small">
            <span class="text-muted">Monto total:</span>
            <span class="fw-bold text-danger"
              >${{ payment().montoTotalRecibido | number: '1.2-2' }}</span
            >
          </div>
        </div>

        <div class="mb-2">
          <label for="motivoAnulacion" class="form-label fw-semibold text-dark small mb-1">
            Motivo de anulación <span class="text-danger">*</span>
          </label>
          <textarea
            id="motivoAnulacion"
            class="form-control form-control-sm shadow-none"
            rows="3"
            placeholder="Especificá la justificación de la anulación (mínimo 5 caracteres)..."
            [(ngModel)]="motivo"
            [disabled]="isLoading"
          ></textarea>
          @if (motivo.length > 0 && motivo.length < 5) {
            <div class="text-danger small mt-1" style="font-size: 0.75rem">
              El motivo debe tener al menos 5 caracteres.
            </div>
          }
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-top px-4 py-3 bg-light d-flex justify-content-between">
        <button
          type="button"
          class="btn btn-outline-secondary fw-medium px-3"
          (click)="close()"
          [disabled]="isLoading"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-danger d-flex align-items-center gap-2 fw-medium px-4"
          (click)="submitAnnul()"
          [disabled]="!isValid || isLoading"
        >
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          }
          @if (!isLoading) {
            <i class="bi bi-trash-fill"></i>
          }
          {{ isLoading ? 'Anulando...' : 'Confirmar Anulación' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
