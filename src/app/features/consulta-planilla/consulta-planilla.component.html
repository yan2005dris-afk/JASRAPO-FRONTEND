<div class="container-fluid">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <div class="mb-4">
              <img ngSrc="assets/JAPO.png" alt="Logo JAPO" width="160" height="80" priority class="img-fluid">
            </div>
            <h2 class="card-title fw-bold mb-4">CONSULTA DE PLANILLA</h2>
            
            <div class="mb-3">
              <label class="visually-hidden" for="searchType">Tipo de búsqueda</label>
              <select id="searchType" class="form-select form-select-lg text-center" [(ngModel)]="searchType">
                @for (option of searchOptions; track option.value) {
                  <option [value]="option.value">{{ option.label }}</option>
                }
              </select>
            </div>
            
            <div class="mb-3">
              <label class="visually-hidden" for="terminoBusqueda">{{ inputLabel }}</label>
              <input 
                id="terminoBusqueda"
                type="text" 
                class="form-control form-control-lg text-center"
                [placeholder]="'Ingrese ' + inputLabel"
                [(ngModel)]="terminoBusqueda"
                (keyup.enter)="onEnter()"
                #terminoInput="ngModel"
                required>
            </div>
            
            <button 
              class="btn btn-primary btn-lg w-100 mt-4" 
              [disabled]="terminoBusqueda.trim() === '' || loading"
              (click)="consultar()">
              @if (!loading) {
                <span>Consultar</span>
              } @else {
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span> Consultando...</span>
              }
            </button>
  
            @if (searchClicked && terminoBusqueda.trim() === '') {
              <div class="alert alert-danger mt-3">
                El campo es obligatorio.
              </div>
            }
            
            @if (noResults) {
              <div class="alert alert-warning mt-3">
                No se encontraron resultados para la búsqueda.
              </div>
            }

            @if (results) {
              <div class="alert alert-success mt-3 text-start">
                <h5 class="alert-heading">Resultado:</h5>
                <p class="mb-0">{{ results.message }}</p>
              </div>
            }
            
            <div class="mt-4">
              <a routerLink="/login" class="text-secondary text-decoration-underline small hover-primary fw-medium">Ir a Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
