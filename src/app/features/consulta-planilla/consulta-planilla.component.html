<div class="container-fluid">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <div class="mb-4">
              <img src="assets/JAPO.png" alt="Logo JAPO" class="img-fluid" style="max-height: 80px;">
            </div>
            <h2 class="card-title font-weight-bold mb-4">CONSULTA DE PLANILLA</h2>
            <div class="form-group mb-3">
              <select class="form-control form-control-lg text-center" [(ngModel)]="searchType">
                <option *ngFor="let option of searchOptions" [value]="option.value">{{ option.label }}</option>
              </select>
            </div>
            <div class="form-group">
              <input 
                type="text" 
                class="form-control form-control-lg text-center"
                [placeholder]="'Ingrese ' + inputLabel"
                [(ngModel)]="terminoBusqueda"
                (keyup.enter)="onEnter()"
                #terminoInput="ngModel"
                required>
            </div>
            <button 
              class="btn btn-primary btn-lg btn-block mt-4" 
              [disabled]="terminoBusqueda.trim() === '' || loading"
              (click)="consultar()">
              <span *ngIf="!loading">Consultar</span>
              <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              <span *ngIf="loading"> Consultando...</span>
            </button>
  
            <div *ngIf="searchClicked && terminoBusqueda.trim() === ''" class="alert alert-danger mt-3">
              El campo es obligatorio.
            </div>
            
            <div *ngIf="noResults" class="alert alert-warning mt-3">
              No se encontraron resultados para la búsqueda.
            </div>
            
            <div class="mt-4">
              <a routerLink="/login" class="text-secondary text-decoration-underline small hover-primary fw-medium">Ir a Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
