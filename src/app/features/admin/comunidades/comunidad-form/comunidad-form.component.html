<div class="modal-header border-bottom-0 pb-0">
  <div>
    <h5 class="modal-title fw-bold">
      {{ comunidadAEditar() ? 'Editar Comunidad' : 'Agregar Nueva Comunidad' }}
    </h5>
    <p class="text-muted mb-0">Completa los datos de la comunidad.</p>
  </div>

  <button
    type="button"
    class="btn-close shadow-none"
    (click)="onClose()"
    aria-label="Cerrar"
  ></button>
</div>

<form [formGroup]="comunidadForm" (ngSubmit)="onSubmit()">
  <div class="modal-body pt-4">
    <div class="mb-3">
      <label for="codigo" class="form-label"
        >Código <span class="text-dark fw-bold ms-1">*</span></label
      >

      <input id="codigo" type="text" class="form-control" formControlName="codigo" />
    </div>

    <div class="mb-3">
      <label for="nombre" class="form-label"
        >Nombre de la comunidad <span class="text-dark fw-bold ms-1">*</span></label
      >

      <input id="nombre" type="text" class="form-control" formControlName="nombre" />
    </div>

    <div class="mb-3">
      <label for="porcentajeTasaSeguridad" class="form-label">
        Porcentaje de tasa de seguridad <span class="text-dark fw-bold ms-1">*</span>
      </label>

      <input
        id="porcentajeTasaSeguridad"
        type="number"
        min="0"
        max="100"
        step="0.01"
        class="form-control"
        formControlName="porcentajeTasaSeguridad"
      />
    </div>
  </div>

  <div class="modal-footer border-top-0 pt-0">
    <button type="button" class="btn btn-outline-secondary fw-medium px-4" (click)="onClose()">
      Cancelar
    </button>

    <button type="submit" class="btn btn-primary" [disabled]="comunidadForm.invalid">
      Guardar
    </button>
  </div>
</form>
