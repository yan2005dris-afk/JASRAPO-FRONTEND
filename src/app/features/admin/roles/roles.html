<div class="container-fluid p-4">
  <div class="row">
    <div class="col-12">
      <h2 class="mb-4 fw-bold">Configuración de roles</h2>

      @if (isLoading()) {
        <div class="d-flex justify-content-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
        </div>
      } @else if (errorMessage()) {
        <div class="alert alert-danger d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ errorMessage() }}</span>
          <button class="btn btn-sm btn-outline-danger ms-auto" (click)="ngOnInit()">
            Reintentar
          </button>
        </div>
      } @else if (roles().length === 0) {
        <div class="alert alert-info">
          <i class="bi bi-info-circle me-2"></i>
          No hay roles configurados en el sistema.
        </div>
      } @else {
        <div class="row g-4 mt-1">
          @for (role of roles(); track role.rolId) {
            <div class="col-md-4">
              <div
                class="card h-100 border shadow-sm"
                [routerLink]="[role.rolId]"
                style="cursor: pointer;"
              >
                <div class="card-body d-flex align-items-center gap-3">
                  <div
                    class="rounded-circle bg-primary-subtle p-2 d-flex align-items-center justify-content-center"
                    style="width: 42px; height: 42px;"
                  >
                    <i class="bi bi-shield-lock text-primary"></i>
                  </div>
                  <div>
                    <h5 class="card-title mb-0">{{ role.nombre }}</h5>
                    <small class="text-muted">Configurar permisos</small>
                  </div>
                  <i class="bi bi-chevron-right text-muted ms-auto"></i>
                </div>
              </div>
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>

<router-outlet></router-outlet>
