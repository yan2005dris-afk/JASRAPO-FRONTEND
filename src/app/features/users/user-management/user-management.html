<div class="px-4 pb-3 d-flex align-items-center border-bottom flex-wrap gap-2">
  <span class="text-muted small me-2 d-flex align-items-center gap-1">
    <i class="bi bi-funnel"></i> Filtros rápidos:
  </span>

  <button
    type="button"
    class="btn btn-filter rounded-pill px-3 py-1"
    [class.active]="activeFilter() === 'Todos'"
    [attr.aria-pressed]="activeFilter() === 'Todos'"
    (click)="setFilter('Todos')"
  >
    Todos
  </button>

  <button
    type="button"
    class="btn btn-filter rounded-pill px-3 py-1"
    [class.active]="activeFilter() === 'Activo'"
    [attr.aria-pressed]="activeFilter() === 'Activo'"
    (click)="setFilter('Activo')"
  >
    Activos
  </button>

  <button
    type="button"
    class="btn btn-filter rounded-pill px-3 py-1"
    [class.active]="activeFilter() === 'Inactivo'"
    [attr.aria-pressed]="activeFilter() === 'Inactivo'"
    (click)="setFilter('Inactivo')"
  >
    Inactivos
  </button>
</div>
