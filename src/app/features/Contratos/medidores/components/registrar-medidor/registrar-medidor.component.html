<!-- 
  Modal de Registro de Medidores
  Formulario reactivo para ingresar nuevos dispositivos al inventario.
-->
<div class="modal-backdrop-custom">
  <div class="modal-panel card shadow-sm">
    <!-- Cabecera del modal -->
    <header class="modal-header">
      <h5 class="modal-title mb-0">Registrar medidor</h5>
      <button
        type="button"
        class="btn-close"
        aria-label="Cerrar"
        [disabled]="isSaving"
        (click)="close()"
      ></button>
    </header>

    <!-- Cuerpo y Formulario -->
    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label for="serie" class="form-label">N° Serie</label>
          <input id="serie" class="form-control" formControlName="serie" placeholder="SN-001" />
          @if (campoInvalido('serie')) {
            <small class="error-text">El número de serie es obligatorio.</small>
          }
        </div>

        <div class="form-group">
          <label for="marca" class="form-label">Marca</label>
          <input id="marca" class="form-control" formControlName="marca" placeholder="Itron" />
          @if (campoInvalido('marca')) {
            <small class="error-text">La marca es obligatoria.</small>
          }
        </div>

        <div class="form-group">
          <label for="modelo" class="form-label">Modelo</label>
          <input id="modelo" class="form-control" formControlName="modelo" placeholder="CX1000" />
          @if (campoInvalido('modelo')) {
            <small class="error-text">El modelo es obligatorio.</small>
          }
        </div>

        <!-- Acciones del formulario -->
        <footer class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            [disabled]="isSaving"
            (click)="close()"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="btn btn-primary btn-sm"
            [disabled]="form.invalid || isSaving"
          >
            {{ isSaving ? 'Guardando...' : 'Guardar' }}
          </button>
        </footer>
      </form>
    </div>
  </div>
</div>
