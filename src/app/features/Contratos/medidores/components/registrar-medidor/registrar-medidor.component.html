<!-- 
  Modal de Registro de Medidores
  Formulario reactivo para ingresar nuevos dispositivos al inventario.
-->
<div class="modal-backdrop-custom">
  <div class="modal-panel card shadow-sm">
    <!-- Cabecera del modal -->
    <header class="modal-header">
      <h5 class="modal-title mb-0">Registrar medidor</h5>
      <button type="button" class="btn-close" aria-label="Cerrar" [disabled]="isSaving" (click)="close()"></button>
    </header>

    <!-- Cuerpo y Formulario -->
    <div class="modal-body">
      @if (errorMessage) {
      <div class="alert alert-danger py-2 px-3 mb-3 small d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label for="serie" class="form-label">N° Serie</label>
          <input id="serie" class="form-control" formControlName="serie" placeholder="SN-001" />
        </div>

        <div class="form-group">
          <label for="marca" class="form-label">Marca</label>
          <input id="marca" class="form-control" formControlName="marca" placeholder="Itron" />
        </div>

        <div class="form-group">
          <label for="modelo" class="form-label">Modelo</label>
          <input id="modelo" class="form-control" formControlName="modelo" placeholder="CX1000" />
        </div>

        <!-- Acciones del formulario -->
        <footer class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" [disabled]="isSaving" (click)="close()">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary btn-sm" [disabled]="isSaving">
            {{ isSaving ? 'Guardando...' : 'Guardar' }}
          </button>
        </footer>
      </form>
    </div>
  </div>
</div>
