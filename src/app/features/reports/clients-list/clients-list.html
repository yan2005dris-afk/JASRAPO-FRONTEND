<app-report-workspace
  title="Listado de Clientes"
  description="Consulte y exporte el padrón general de clientes con el mismo estado y período en la vista previa, descarga y correo."
  [contextItems]="contextItems()"
  [status]="workspaceStatus()"
  [statusMessage]="workspaceStatusMessage()"
  [showToolbar]="true"
  [showResults]="!!pdfBlob()"
  (retry)="retryLastAction()"
>
  <div reportFilters>
    <div class="row g-3 align-items-end">
      <div class="col-lg-3 col-md-6">
        <label class="form-label small fw-semibold" for="activo">Estado del cliente</label>
        <select
          id="activo"
          class="form-select"
          [ngModel]="activo()"
          (ngModelChange)="actualizarEstado($event)"
        >
          <option value="">Todos los estados</option>
          <option value="true">Solo activos</option>
          <option value="false">Solo inactivos</option>
        </select>
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label small fw-semibold" for="fechaDesde">Fecha desde</label>
        <app-date-picker
          inputId="fechaDesde"
          [value]="fechaDesde()"
          (valueChange)="actualizarFechaDesde($event)"
        />
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label small fw-semibold" for="fechaHasta">Fecha hasta</label>
        <app-date-picker
          inputId="fechaHasta"
          [value]="fechaHasta()"
          (valueChange)="actualizarFechaHasta($event)"
        />
      </div>

      <div class="col-lg-3 col-md-6 d-flex flex-wrap gap-2">
        <button
          type="button"
          class="btn btn-primary d-inline-flex align-items-center gap-2"
          [disabled]="isLoadingPdf() || rangoFechaInvalido()"
          (click)="generarPdf()"
        >
          <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>
          Generar PDF
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary d-inline-flex align-items-center gap-2"
          [disabled]="isLoadingPdf()"
          (click)="limpiar()"
        >
          <i class="bi bi-x-circle" aria-hidden="true"></i>
          Limpiar
        </button>
      </div>
    </div>

    <div class="quick-range-bar">
      <span>Rango rápido:</span>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="aplicarPreset('currentYear')"
      >
        Este año
      </button>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="aplicarPreset('currentMonth')"
      >
        Este mes
      </button>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="aplicarPreset('lastMonth')"
      >
        Mes pasado
      </button>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="aplicarPreset('last3Months')"
      >
        Últimos 3 meses
      </button>
    </div>

    @if (rangoFechaInvalido()) {
      <p class="filter-validation" role="alert">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        La fecha desde no puede ser mayor que la fecha hasta.
      </p>
    }
  </div>

  <div reportActions>
    @if (pdfBlob()) {
      <button type="button" class="btn btn-sm btn-outline-primary" (click)="descargarPdf()">
        <i class="bi bi-download" aria-hidden="true"></i>
        Descargar PDF
      </button>
    }
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary"
      [disabled]="rangoFechaInvalido()"
      (click)="abrirModalEmail()"
    >
      <i class="bi bi-envelope" aria-hidden="true"></i>
      Enviar por correo
    </button>
  </div>

  <div reportResults>
    @if (pdfBlob(); as pdf) {
      <app-pdf-previewer
        [src]="pdf"
        height="clamp(28rem, 70vh, 48rem)"
        ariaLabel="Vista previa del listado oficial de clientes"
      />
    }
  </div>

  @if (isEmailModalOpen()) {
    <app-report-email-dialog
      reportDialog
      title="Enviar listado de clientes por correo"
      [initialRecipient]="destinatario()"
      [initialSubject]="subject()"
      [contextItems]="contextItems()"
      [isSubmitting]="isSendingEmail()"
      (closed)="cerrarModalEmail()"
      (submitted)="enviarEmail($event)"
    />
  }
</app-report-workspace>
