<div class="report-format-tabs" role="tablist" aria-label="Formato del reporte">
  <button
    id="report-table-tab"
    type="button"
    class="report-format-tabs__tab"
    role="tab"
    [class.report-format-tabs__tab--active]="activeFormat() === 'table'"
    [attr.aria-selected]="activeFormat() === 'table'"
    aria-controls="report-results-panel"
    (click)="formatChange.emit('table')"
  >
    <i class="bi bi-table" aria-hidden="true"></i>
    Tabla
  </button>
  <button
    id="report-pdf-tab"
    type="button"
    class="report-format-tabs__tab"
    role="tab"
    [class.report-format-tabs__tab--active]="activeFormat() === 'pdf'"
    [attr.aria-selected]="activeFormat() === 'pdf'"
    aria-controls="report-results-panel"
    [disabled]="pdfLoading()"
    (click)="formatChange.emit('pdf')"
  >
    @if (pdfLoading()) {
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      <span class="visually-hidden">Generando PDF</span>
    } @else {
      <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>
    }
    PDF
  </button>
</div>
