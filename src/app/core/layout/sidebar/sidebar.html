<nav class="h-100 d-flex flex-column bg-white">
    <!-- Brand/Logo Section -->
    <div class="sidebar-brand text-center py-4 border-bottom">
        <img src="assets/water_drop_icon_175805.png" alt="AquaSync Olón Logo" class="brand-logo mb-2">
        <h5 class="fw-bold mb-0 text-dark" style="font-size: 1.1rem; letter-spacing: -0.5px;">AquaSync Olón</h5>
    </div>

    <!-- Navigation Menu -->
    <div class="sidebar-nav pt-3 grow overflow-auto">
        <ul class="nav flex-column mb-auto">
            <!-- Menú Dinámico -->
            <ng-container *ngFor="let item of menuService.menuItems()">
                <li class="nav-item">
                    <!-- Item con hijos (collapsible) -->
                    <ng-container *ngIf="item.children && item.children.length > 0">
                        <a class="nav-link nav-link-custom d-flex justify-content-between align-items-center"
                            (click)="toggleItem(item.id)" 
                            [attr.aria-expanded]="isExpanded(item.id)" 
                            role="button">
                            <span class="text-dark">
                                <i class="bi bi-chevron-down align-middle me-2 fw-bold"
                                    [ngClass]="{'rotate-icon': isExpanded(item.id)}"></i>
                                <i *ngIf="item.icon" [class]="'bi ' + item.icon + ' me-2'"></i>
                                {{ item.label }}
                            </span>
                        </a>

                        <div class="collapse" [class.show]="isExpanded(item.id)">
                            <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small ps-4">
                                <li *ngFor="let child of item.children">
                                    <a [routerLink]="child.route" 
                                       routerLinkActive="active"
                                       class="nav-link-sub rounded">
                                        {{ child.label }}
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </ng-container>

                    <!-- Item sin hijos (link directo) -->
                    <ng-container *ngIf="!item.children || item.children.length === 0">
                        <a [routerLink]="item.route" 
                           routerLinkActive="active"
                           class="nav-link nav-link-custom d-flex align-items-center text-dark">
                            <i *ngIf="item.icon" [class]="'bi ' + item.icon + ' me-2'"></i>
                            <span [class.ps-4]="!item.icon">{{ item.label }}</span>
                        </a>
                    </ng-container>
                </li>
            </ng-container>
        </ul>
    </div>
</nav>
