@if (config(); as dialog) {
  <button
    type="button"
    class="modal-backdrop-custom border-0"
    (click)="onCancel()"
    aria-label="Cerrar diálogo de confirmación"
  ></button>

  <div class="modal-custom" role="dialog" aria-modal="true">
    <div class="modal-card modal-card-sm">
      <div class="modal-card-header d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0" [class.text-danger]="dialog.isDanger">
          <i
            class="bi me-2"
            [ngClass]="dialog.isDanger ? 'bi-exclamation-triangle-fill' : 'bi-question-circle-fill'"
          ></i>
          {{ dialog.title || 'Confirmación' }}
        </h5>
        <button type="button" class="btn-close-modal" (click)="onCancel()" aria-label="Cerrar">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="modal-card-body text-center py-4">
        <p class="text-secondary mb-0">{{ dialog.message }}</p>
      </div>

      <div class="modal-card-footer d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary fw-medium px-4" (click)="onCancel()">
          {{ dialog.cancelText || 'Cancelar' }}
        </button>
        <button
          type="button"
          class="btn fw-medium px-4"
          [class.btn-danger]="dialog.isDanger"
          [class.btn-primary]="!dialog.isDanger"
          (click)="onConfirm()"
        >
          {{ dialog.confirmText || 'Aceptar' }}
        </button>
      </div>
    </div>
  </div>
}
