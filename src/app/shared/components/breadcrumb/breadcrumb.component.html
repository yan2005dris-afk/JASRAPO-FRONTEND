@if (breadcrumbService.breadcrumbs().length > 0) {
  <nav aria-label="Navegación de migas de pan" class="pb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item">
        <a routerLink="/app/dashboard" aria-label="Inicio">
          <i class="bi bi-house-door"></i>
        </a>
      </li>
      @for (crumb of breadcrumbService.breadcrumbs(); track crumb.url; let isLast = $last) {
        @if (isLast) {
          <li class="breadcrumb-item active" aria-current="page">
            <span class="fw-semibold">{{ crumb.label }}</span>
          </li>
        } @else {
          <li class="breadcrumb-item">
            <a [routerLink]="crumb.url">{{ crumb.label }}</a>
          </li>
        }
      }
    </ol>
  </nav>
}
