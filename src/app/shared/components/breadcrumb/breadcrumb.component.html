@if (breadcrumbService.breadcrumbs().length > 1) {
  <nav aria-label="Navegación de migas de pan" class="pb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item">
        <a routerLink="/app/dashboard" aria-label="Inicio">
          <i class="bi bi-house-door"></i>
        </a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">
        <span class="fw-semibold">{{
          breadcrumbService.breadcrumbs()[breadcrumbService.breadcrumbs().length - 1].label
        }}</span>
      </li>
    </ol>
  </nav>
}
